<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>تطبيق التلفاز الذكي - النسخة الاحترافية</title>
  <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
      font-family: sans-serif;
    }
    .video-js {
      width: 100vw;
      height: 100vh;
    }
    
    /* --- تنسيق القائمة الجانبية (تم التعديل) --- */
    #channel-menu {
      position: absolute;
      top: 0;
      right: -320px; /* مخفية خارج الشاشة */
      width: 300px; /* عرض مناسب */
      height: 100vh; /* طول الشاشة كامل */
      background: rgba(0, 0, 0, 0.95); /* خلفية غامقة */
      padding: 20px;
      box-sizing: border-box;
      transition: right 0.4s ease; /* حركة ناعمة */
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* ✅ تعديل: البدء من الأعلى لكي لا تختفي الأزرار */
      overflow-y: auto; /* ✅ تعديل: السماح بالتمرير (Scroll) */
      box-shadow: -5px 0 15px rgba(0,0,0,0.8);
    }

    /* إخفاء شريط التمرير للحفاظ على الجمالية */
    #channel-menu::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }

    /* كلاس لإظهار القائمة */
    #channel-menu.visible {
      right: 0; /* إعادتها للشاشة */
    }
    
    /* عنوان القائمة */
    .menu-title {
      color: #f0c419;
      font-size: 24px;
      margin-bottom: 20px;
      text-align: right;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
      margin-top: 10px;
    }
    
    /* الأزرار */
    #channel-menu button {
      display: block;
      width: 100%;
      margin-bottom: 12px;
      padding: 15px;
      font-size: 18px; 
      cursor: pointer;
      background: #222;
      color: #bbb;
      border: 2px solid transparent;
      border-radius: 8px;
      text-align: right;
      outline: none;
      transition: all 0.2s;
      flex-shrink: 0; /* يمنع الأزرار من الانكماش */
    }
    
    /* الزر المختار */
    #channel-menu button.selected {
      background: #f0c419;
      color: #000;
      border-color: #fff;
      font-weight: bold;
      transform: scale(1.02);
      box-shadow: 0 0 10px rgba(240, 196, 25, 0.5);
    }

    /* أيقونة صغيرة لتنبيه المستخدم بوجود قائمة */
    #menu-hint {
      position: absolute;
      top: 20px;
      right: 20px;
      color: rgba(255,255,255,0.5);
      z-index: 100;
      font-size: 20px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 5px;
      opacity: 0;
      transition: opacity 1s;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="menu-hint">≡ اضغط OK للقائمة</div>

  <video id="my-video" class="video-js" controls preload="auto" data-setup="{}">
    <source src="https://live.kwikmotion.com/syriatvlive/syriatv.smil/playlist_dvr.m3u8" type="application/x-mpegURL" />
  </video>

  <div id="channel-menu">
    <div class="menu-title">📺 قائمة القنوات</div>

    <button onclick="window.location.reload(true)" style="background: #d32f2f; color: white;">
      🔄 تحديث القائمة
    </button>

    <button onclick="playChannel('https://live.kwikmotion.com/syriatvlive/syriatv.smil/playlist_dvr.m3u8')">
      🇸🇾 القناة السورية
    </button>
    
    <button onclick="playChannel('https://live.kwikmotion.com/syriatv02live/syriatv02.smil/syriatv02publish/syriatv02_source/chunks.m3u8')">
      🎭 سوريا دراما (محدث)
    </button>
    
    <button onclick="playChannel('https://p-ltv.akamaized.net/ltv/ltv_1.m3u8')">
      🟣 قناة لنا
    </button>
    
    <button onclick="playChannel('https://shls-live-enc.edgenextcdn.net/out/v1/08eca926a78a41339b8010c882410307/index_2.m3u8')">
      🇪🇬 MBC مصر دراما
    </button>

   <button onclick="playChannel('https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-plus-drama/e37251ec2aac8f6c98f75cd0fa37cd28/index.m3u8')">
  🎭 MBC Drama+ (1)
</button>

    <button onclick="playChannel('https://mbc1-enc.edgenextcdn.net/out/v1/0965e4d7deae49179172426cbfb3bc5e/index_7.m3u8')">
      MBC 1
    </button>

    <button onclick="playChannel('https://azrogo.com/local/drPlayer/?id=mbc2')">
  🎬 MBC 2 
</button>

    <button onclick="playChannel('https://ml-pull-hwc.myco.io/MixTV/hls/MixTV_H264-360p.m3u8?pkg_media=video&pkg_hm=index.m3u8&pkg_svc=1&pkg_vcodec=avc1')">
      MIX MOVIE
    </button>

    <button onclick="playChannel('https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-4/24f134f1cd63db9346439e96b86ca6ed/index.m3u8')">
  📺 MBC 4 
</button>

   <button onclick="playChannel('https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-1-usa/fdac3a4fc0473f1f56e07ec1d63a4b7b/index.m3u8')">
  1️⃣ MBC 1+
</button>

<button onclick="playChannel('https://live-hls-web-ajd.getaj.net/AJD/06.m3u8')">
  🌍 الجزيرة الوثائقية
</button>
    
  </div>

  <script src="https://vjs.zencdn.net/8.3.0/video.js"></script>
  
  <script>
    var player = videojs('my-video');
    var menu = document.getElementById('channel-menu');
    var hint = document.getElementById('menu-hint');
    var menuButtons = document.querySelectorAll('#channel-menu button');
    
    // حالات التطبيق
    var appState = 'video'; 
    var menuIndex = 0;

    // --- ✅ 1. كود منع الخروج المفاجئ (Error Handler) ---
    player.on('error', function() {
      console.log("تم منع حدوث كراش بسبب خطأ في القناة");
      player.error(null); // مسح الخطأ لإبقاء التطبيق يعمل
    });

    function showHint() {
      hint.style.opacity = 1;
      setTimeout(() => { hint.style.opacity = 0; }, 5000); 
    }

    player.ready(function() {
      showHint();
    });

    function toggleMenu() {
      if (appState === 'video') {
        appState = 'menu';
        menu.classList.add('visible');
        updateSelection();
      } else {
        appState = 'video';
        menu.classList.remove('visible');
        player.focus(); 
      }
    }

    function updateSelection() {
      // إزالة التحديد عن الكل
      menuButtons.forEach(btn => btn.classList.remove('selected'));
      
      // تحديد الزر الحالي
      if (appState === 'menu') {
        var btn = menuButtons[menuIndex];
        btn.classList.add('selected');
        btn.focus();

        // --- ✅ 2. كود اللحاق بالزر (Auto Scroll) ---
        // هذا السطر يخلي القائمة تتحرك لتظهر الزر المخفي
        btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    document.addEventListener('keydown', function(event) {
      
      const keys = [13, 37, 38, 39, 40, 8, 27, 461, 10009];
      if (keys.includes(event.keyCode)) {
         // Prevent default
      }

      // زر الرجوع
      if ([8, 27, 461, 10009].includes(event.keyCode)) {
        if (appState === 'menu') {
          event.preventDefault();
          toggleMenu(); 
          return;
        }
      }

      if (appState === 'video') {
        if (event.keyCode === 13) {
            event.preventDefault();
            toggleMenu();
        }
      } 
      else if (appState === 'menu') {
        event.preventDefault(); 

        if (event.keyCode === 40) { // تحت
          if (menuIndex < menuButtons.length - 1) menuIndex++;
        } 
        else if (event.keyCode === 38) { // فوق
          if (menuIndex > 0) menuIndex--;
        }
        else if (event.keyCode === 13) { // تشغيل
          menuButtons[menuIndex].click();
        }
        else if (event.keyCode === 37) { // يسار
           toggleMenu();
        }

        updateSelection();
      }
    });

    function playChannel(link) {
      // --- ✅ 3. كود تفريغ الذاكرة (منع الكراش) ---
      player.pause(); // إيقاف القديم فوراً
      player.src({ src: link, type: 'application/x-mpegURL' });
      player.play();
    }
  </script>
</body>
</html>
